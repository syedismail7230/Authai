version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: authai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: authai
    volumes:
      - mongodb_data:/data/db
    networks:
      - authai-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test -u admin -p password
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authai-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/authai?authSource=admin
      JWT_SECRET: your_jwt_secret_key_change_this
      AI_SERVICE_URL: http://ai-service:8000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - authai-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authai-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - authai-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: authai-ai-service
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      - authai-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  authai-network:
    driver: bridge
